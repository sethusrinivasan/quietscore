name: Validate and deploy QuietScore

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quietscore-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install Rust and WASM target
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build optimized application
        run: pnpm build
      - name: Check source formatting
        run: pnpm format:check
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Verify FIRST parity, privacy, exports, and MCP
        run: pnpm test
      - name: Validate Cloudflare package
        run: pnpm deploy:check
      - name: Deploy main to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure the CLOUDFLARE_API_TOKEN repository secret.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Configure the CLOUDFLARE_ACCOUNT_ID repository variable.'; exit 1; }
          pnpm run deploy | tee /tmp/quietscore-deployment.log
          node scripts/smoke-deployment.cjs /tmp/quietscore-deployment.log
